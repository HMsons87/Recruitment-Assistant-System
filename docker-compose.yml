services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: smart-recruitment-backend
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models:ro
      - ./data:/app/data:ro
      - ./outputs:/app/outputs:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 20s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: smart-recruitment-frontend
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data:ro
      - ./outputs:/app/outputs:ro
    environment:
      API_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
